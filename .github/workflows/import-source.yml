name: Import cleaned source

on:
  push:
    branches: [main]
    paths:
      - '.import/source.tar.gz.b64'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct cleaned source archive
        shell: bash
        run: |
          base64 -d .import/source.tar.gz.b64 > /tmp/semantic_detector_source.tar.gz
          echo "02cf13b47ed9f51aae2f93d45f6a04a739df16ca6256f644755a5871852dfa21  /tmp/semantic_detector_source.tar.gz" | sha256sum -c -

      - name: Replace bootstrap files with source tree
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.import' ! -name '.github' -exec rm -rf {} +
          tar -xzf /tmp/semantic_detector_source.tar.gz -C .
          rm -rf .import
          rm -f .github/workflows/import-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import cleaned semantic detector source"
          git push origin HEAD:main
