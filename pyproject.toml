[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic_detector"
version = "0.1.0"
description = "Rule-based semantic inference toolkit for binary protocol fields"
keywords = ["binary protocol", "protocol reverse engineering", "semantic inference", "network protocol analysis"]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Semantic Detector Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    'tomli>=2.0.1; python_version < "3.11"',
    "build>=1.2.0",
    "twine>=5.0.0",
    "jsonschema>=4.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
[project.urls]
Homepage = "https://github.com/Zhao-create-zc/Semantic-detector"
Repository = "https://github.com/Zhao-create-zc/Semantic-detector"
Issues = "https://github.com/Zhao-create-zc/Semantic-detector/issues"
Documentation = "https://github.com/Zhao-create-zc/Semantic-detector/tree/main/docs"
Changelog = "https://github.com/Zhao-create-zc/Semantic-detector/blob/main/CHANGELOG.md"
